
name: Deploy InfiniteTalk to Modal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: python -m pip install --upgrade pip modal pydantic

      - name: Check credentials
        run: |
          test -n "$MODAL_TOKEN_ID" || (echo "Missing MODAL_TOKEN_ID secret" && exit 1)
          test -n "$MODAL_TOKEN_SECRET" || (echo "Missing MODAL_TOKEN_SECRET secret" && exit 1)

      - name: Deploy InfiniteTalk
        run: modal deploy app.py
